edition = "2024";
package kts.scalar;

message Decimal {
  float float_value = 1;
  double double_value = 2;
}

message Integer {
  int32 signed_variable_int32 = 1;
  int64 signed_variable_int64 = 2;
//  uint32 unsigned_variable_int32 = 3;
//  uint64 unsigned_variable_int64 = 4;
  sint32 signed_zigzag_int32 = 5;
  sint64 signed_zigzag_int64 = 6;
  fixed32 unsigned_fixed_int32 = 7;
  fixed64 unsigned_fixed_int64 = 8;
//  sfixed32 signed_fixed_int32 = 9;
//  sfixed64 signed_fixed_int64 = 10;
}

message Logical {
  bool boolean = 1;
}

message Sequence {
  bytes bytes_sequence = 1;
  string chars_sequence = 2;
}